name: Check hefdah
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 scripts/build_release.py --check
      - run: python -X utf8 scripts/build_release.py --zip
